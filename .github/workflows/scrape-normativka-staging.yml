# Нормативка: scheduled scrape of pravo.gov.ru ИПС + reindex into OpenSearch.
#
# Ночной прогон инкрементален: тянет обёртку акта (~40-100КБ), сравнивает
# текущий rdk с тем, что лежит в индексе, и перекачивает только изменившиеся.
# Ручной запуск может форсировать полный перескрейп (mode=full, acts=all).
#
# Requirements in the "Staging ENV" environment (все уже настроены деплоями):
#   secret YC_SA_JSON / YC_CLOUD_ID / YC_FOLDER_ID — авторезолв IP OpenSearch-VM
#          (публичный IP эфемерный, поэтому не хардкодим и не держим в var;
#          тот же механизм, что в deploy-yandex-cloud-staging-coi.yml)
#   var    S3_BUCKET_NAME           — snapshot archive bucket (same as court practice)
#   secret S3_ACCESS_KEY_ID / S3_SECRET_ACCESS_KEY
# A dispatch input can override the resolved URL (e.g. для локального туннеля).

name: Scrape normativka (Staging OpenSearch)

# Два разных вопроса — два расписания:
#   ночью «не изменились ли известные акты» — состав корпуса берём из индекса
#     (--acts indexed), каталог портала не обходим, и делим корпус на 7 шардов
#     по дню года: ~205 обёрток за прогон, ~15 минут, за неделю покрыт весь;
#   в воскресенье «не появилось ли новых» — полный обход каталога, но грузим
#     только отсутствующие в индексе акты (--only-new), иначе 1437 проверок
#     обёрток не влезают в разумное время.
on:
  schedule:
    - cron: '0 3 * * 1-6'   # пн-сб 03:00 UTC: инкремент по шардам
    - cron: '0 3 * * 0'     # вс 03:00 UTC: обход каталога ради новых актов
  workflow_dispatch:
    inputs:
      mode:
        description: 'Scrape mode'
        required: false
        default: update
        type: choice
        options: [update, full]
      acts:
        description: 'Что обновлять (indexed | all | kodeksy | fz | nd-список)'
        required: false
        default: indexed
        type: string
      opensearch_url:
        description: 'OpenSearch URL (default: авторезолв IP VM через yc)'
        required: false
        type: string

jobs:
  scrape-and-index:
    runs-on: ubuntu-latest
    environment: Staging ENV
    # Ночной шард укладывается в ~15 минут; воскресный обход каталога ФЗ — это
    # ~570 запросов перечисления плюс выемка новых актов, отсюда запас.
    timeout-minutes: 180

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      # Публичный IP OpenSearch-VM эфемерный (stop/start его меняет), поэтому
      # он резолвится через yc на каждом запуске — тот же read-only механизм,
      # что в deploy-yandex-cloud-staging-coi.yml. Явный inputs.opensearch_url
      # обходит резолв (тогда yc-шаги не нужны и пропускаются).
      - name: Install Yandex Cloud CLI
        if: github.event.inputs.opensearch_url == ''
        run: |
          mkdir -p $HOME/.local/bin
          curl -sSL https://storage.yandexcloud.net/yandexcloud-yc/install.sh | bash -s
          if [ -f "$HOME/.local/bin/yc" ]; then
            chmod +x $HOME/.local/bin/yc
            echo "$HOME/.local/bin" >> $GITHUB_PATH
          else
            YC_PATH=$(find $HOME -name yc -type f -executable 2>/dev/null | head -1)
            if [ -n "$YC_PATH" ]; then
              echo "$(dirname $YC_PATH)" >> $GITHUB_PATH
            else
              echo "Error: yc not found after installation"
              exit 1
            fi
          fi

      - name: Setup Yandex Cloud CLI with JSON key
        if: github.event.inputs.opensearch_url == ''
        env:
          YC_SA_JSON: ${{ secrets.YC_SA_JSON }}
          YC_CLOUD_ID: ${{ secrets.YC_CLOUD_ID }}
          YC_FOLDER_ID: ${{ secrets.YC_FOLDER_ID }}
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          if [ -z "$YC_SA_JSON" ]; then
            echo "Error: YC_SA_JSON secret is empty or not set"
            exit 1
          fi
          printf '%s' "$YC_SA_JSON" | sed 's/[[:space:]]*$//' > /tmp/sa-key.json
          chmod 600 /tmp/sa-key.json
          yc config profile create scrape-profile || true
          yc config set service-account-key /tmp/sa-key.json
          yc config set cloud-id "$YC_CLOUD_ID"
          yc config set folder-id "$YC_FOLDER_ID"

      - name: Resolve parameters
        id: params
        env:
          INPUT_URL: ${{ github.event.inputs.opensearch_url }}
          INPUT_MODE: ${{ github.event.inputs.mode }}
          INPUT_ACTS: ${{ github.event.inputs.acts }}
          SCHEDULE: ${{ github.event.schedule }}
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          URL="$INPUT_URL"
          if [ -z "$URL" ]; then
            VM="lawers-opensearch-staging"
            if ! yc compute instance get --name "$VM" >/dev/null 2>&1; then
              echo "Error: OpenSearch VM '$VM' not found (см. deploy-opensearch-staging.yml)"
              exit 1
            fi
            # jq, а не inline-python: YAML срезает только общий отступ блока
            # run, поэтому питон, вложенный в if/then, приезжает в интерпретатор
            # с лишними пробелами и падает IndentationError (так и случилось на
            # первом ночном запуске).
            PUBLIC_IP=$(yc compute instance get --name "$VM" --format json \
              | jq -r '[.network_interfaces[]?.primary_v4_address.one_to_one_nat.address // empty] | first // empty')
            if [ -z "$PUBLIC_IP" ]; then
              echo "Error: could not resolve public IP for $VM"
              exit 1
            fi
            URL="http://${PUBLIC_IP}:9200"
          fi
          MODE="${INPUT_MODE:-update}"

          # Что обновляем: ручной запуск решает сам, расписание — по дню.
          # Воскресный прогон ищет НОВЫЕ акты (полный обход каталога), будние
          # проверяют известные по шардам: 1/7 корпуса за ночь, вся неделя —
          # полный круг. Шард считаем по дню года, а не по дню недели, иначе
          # воскресный шард не проверялся бы никогда.
          ACTS="$INPUT_ACTS"
          EXTRA=""
          if [ -z "$ACTS" ]; then
            if [ "$SCHEDULE" = "0 3 * * 0" ]; then
              ACTS="all"
              EXTRA="--only-new"
            else
              ACTS="indexed"
              EXTRA="--shard $(( $(date -u +%j) % 7 + 1 ))/7"
            fi
          fi

          echo "OpenSearch URL: $URL | mode: $MODE | acts: $ACTS | extra: ${EXTRA:-—}"
          echo "url=$URL" >> "$GITHUB_OUTPUT"
          echo "mode=$MODE" >> "$GITHUB_OUTPUT"
          echo "acts=$ACTS" >> "$GITHUB_OUTPUT"
          echo "extra=$EXTRA" >> "$GITHUB_OUTPUT"
          echo "stamp=$(date -u +%Y%m%d-%H%M)" >> "$GITHUB_OUTPUT"

      - name: Install uv
        run: curl -LsSf https://astral.sh/uv/install.sh | sh

      - name: Install dependencies
        working-directory: backend
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          uv sync

      # continue-on-error: one flaky act (the ИПС stalls intermittently) must
      # not discard the successfully scraped acts — the snapshot still gets
      # archived and indexed, and the final step turns the run red afterwards.
      - name: Scrape pravo.gov.ru
        id: scrape
        continue-on-error: true
        working-directory: backend
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          uv run python scripts/scrape_normativka.py \
            --out /tmp/normativka-${{ steps.params.outputs.stamp }}.zip \
            --mode "${{ steps.params.outputs.mode }}" \
            --acts "${{ steps.params.outputs.acts }}" \
            ${{ steps.params.outputs.extra }} \
            --opensearch-url "${{ steps.params.outputs.url }}"

      - name: Archive snapshot to Object Storage
        env:
          S3_BUCKET_NAME: ${{ vars.S3_BUCKET_NAME }}
          S3_ACCESS_KEY_ID: ${{ secrets.S3_ACCESS_KEY_ID }}
          S3_SECRET_ACCESS_KEY: ${{ secrets.S3_SECRET_ACCESS_KEY }}
        run: |
          if [ -z "$S3_BUCKET_NAME" ]; then
            echo "S3_BUCKET_NAME not set — skipping snapshot archive"
            exit 0
          fi
          pip install --quiet awscli
          aws configure set default.s3.signature_version s3v4
          export AWS_ACCESS_KEY_ID="$S3_ACCESS_KEY_ID"
          export AWS_SECRET_ACCESS_KEY="$S3_SECRET_ACCESS_KEY"
          aws --endpoint-url=https://storage.yandexcloud.net s3 cp \
            /tmp/normativka-${{ steps.params.outputs.stamp }}.zip \
            "s3://${S3_BUCKET_NAME}/normativka/normativka-${{ steps.params.outputs.stamp }}.zip"

      - name: Index snapshot
        working-directory: backend
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          uv run python scripts/index_normativka.py \
            --source /tmp/normativka-${{ steps.params.outputs.stamp }}.zip \
            --opensearch-url "${{ steps.params.outputs.url }}"

      - name: Verify document count
        run: |
          curl -fsS "${{ steps.params.outputs.url }}/legal_acts/_count"

      # The scrape step is continue-on-error so partial results still land in
      # the index; this step makes a partial night visibly red afterwards.
      - name: Fail the run if the scrape had errors
        if: steps.scrape.outcome == 'failure'
        run: |
          echo "Часть актов не скрейпнулась (см. шаг Scrape) — успешные проиндексированы, но ночь неполная"
          exit 1
